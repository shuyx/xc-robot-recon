<html><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <style>::-webkit-scrollbar { display: none;}</style>
    <script>tailwind.config = {
  "theme": {
    "extend": {
      "colors": {
        "primary": "#409EFF",
        "secondary": "#2c3e50",
        "success": "#00A870",
        "warning": "#E6A23C",
        "danger": "#F56C6C",
        "info": "#909399",
        "light": "#E6F4FF",
        "favorite": "#FFD700",
        "category": "#F8F9FA"
      },
      "fontFamily": {
        "sans": [
          "Inter",
          "sans-serif"
        ]
      }
    }
  }
};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;500;600;700;800;900&amp;display=swap"><style>
      body {
        font-family: 'Inter', sans-serif !important;
      }
      
      /* Preserve Font Awesome icons */
      .fa, .fas, .far, .fal, .fab {
        font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
      }
    </style><style>
  .highlighted-section {
    outline: 2px solid #3F20FB;
    background-color: rgba(63, 32, 251, 0.1);
  }

  .edit-button {
    position: absolute;
    z-index: 1000;
  }

  ::-webkit-scrollbar {
    display: none;
  }

  html, body {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  </style></head>
<body class="font-sans text-secondary">
    <div id="app" class="h-[calc(100vh-100px)] overflow-auto bg-light p-6">
        <!-- Page Header -->
        <div id="page-header" class="mb-6">
            <h1 class="text-2xl font-bold text-secondary">收藏功能管理</h1>
            <p class="text-gray-500 mt-1">管理和快速访问常用功能模块</p>
        </div>

        <!-- Category Filter -->
        <div id="category-filter" class="mb-6">
            <h2 class="text-lg font-semibold mb-3 flex items-center">
                <i class="fa-solid fa-tags mr-2 text-primary"></i>功能分类
            </h2>
            <div class="flex flex-wrap gap-3">
                <button class="px-4 py-2 rounded-md flex items-center gap-2 transition-colors" :class="activeCategory === 'all' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('all')">
                    <i class="fa-solid fa-check-circle" :class="activeCategory === 'all' ? 'text-white' : 'text-success'"></i>
                    全部
                </button>
                <button class="px-4 py-2 rounded-md flex items-center gap-2 bg-category text-secondary hover:bg-gray-200 transition-colors" :class="activeCategory === '控制类' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('控制类')">
                    <i class="fa-solid fa-gamepad"></i>
                    控制类
                </button>
                <button class="px-4 py-2 rounded-md flex items-center gap-2 bg-category text-secondary hover:bg-gray-200 transition-colors" :class="activeCategory === '监控类' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('监控类')">
                    <i class="fa-solid fa-chart-line"></i>
                    监控类
                </button>
                <button class="px-4 py-2 rounded-md flex items-center gap-2 bg-category text-secondary hover:bg-gray-200 transition-colors" :class="activeCategory === '设置类' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('设置类')">
                    <i class="fa-solid fa-gear"></i>
                    设置类
                </button>
                <button class="px-4 py-2 rounded-md flex items-center gap-2 bg-category text-secondary hover:bg-gray-200 transition-colors" :class="activeCategory === '交互类' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('交互类')">
                    <i class="fa-solid fa-comments"></i>
                    交互类
                </button>
                <button class="px-4 py-2 rounded-md flex items-center gap-2 bg-category text-secondary hover:bg-gray-200 transition-colors" :class="activeCategory === '仿真类' ? 'bg-primary text-white' : 'bg-category text-secondary hover:bg-gray-200'" @click="filterByCategory('仿真类')">
                    <i class="fa-solid fa-vr-cardboard"></i>
                    仿真类
                </button>
            </div>
        </div>

        <!-- Favorites List -->
        <div id="favorites-list" class="mb-8">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold flex items-center">
                    <i class="fa-solid fa-star mr-2 text-favorite"></i>我的收藏
                    <span class="text-sm text-gray-500 ml-2">(拖拽排序)</span>
                </h2>
                <div class="flex items-center gap-2">
                    <button class="text-primary hover:text-primary/80 flex items-center gap-1">
                        <i class="fa-solid fa-sort"></i>
                        <span>默认排序</span>
                    </button>
                    <button class="text-primary hover:text-primary/80 flex items-center gap-1">
                        <i class="fa-solid fa-arrow-down-wide-short"></i>
                        <span>使用频率</span>
                    </button>
                </div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                <div id="sortable-list" class="divide-y divide-gray-100">
                    <div v-for="(item, index) in filteredFavorites" :key="index" class="p-4 hover:bg-gray-50 transition-colors flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-10 flex-shrink-0 flex justify-center">
                                <i :class="item.icon + ' text-xl text-primary'"></i>
                            </div>
                            <div class="ml-3">
                                <h3 class="font-medium text-secondary">{{ item.name }}</h3>
                                <div class="flex items-center mt-1 text-sm text-gray-500 space-x-4">
                                    <span class="flex items-center">
                                        <i class="fa-solid fa-tag text-xs mr-1"></i>
                                        {{ item.category }}
                                    </span>
                                    <span class="flex items-center">
                                        <i class="fa-solid fa-chart-simple text-xs mr-1 text-success"></i>
                                        使用 {{ item.usageCount }} 次
                                    </span>
                                    <span class="flex items-center">
                                        <i class="fa-regular fa-clock text-xs mr-1"></i>
                                        {{ item.lastUsed }}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button class="text-primary hover:text-primary/80 px-3 py-1.5 rounded-md border border-primary/20 hover:border-primary/40 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>
                                访问
                            </button>
                            <button class="text-gray-500 hover:text-danger px-3 py-1.5 rounded-md border border-gray-200 hover:border-danger/40 transition-colors" @click="unfavorite(item)">
                                <i class="fa-solid fa-star text-favorite mr-1"></i>
                                取消收藏
                            </button>
                            <button class="text-gray-400 hover:text-gray-600 ml-2">
                                <i class="fa-solid fa-grip-vertical"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div v-if="filteredFavorites.length === 0" class="p-8 text-center text-gray-500">
                    <i class="fa-regular fa-star text-3xl mb-2"></i>
                    <p>没有找到收藏的功能</p>
                </div>
            </div>
        </div>

        <!-- Stats and Add Favorites -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Usage Statistics -->
            <div id="usage-stats" class="bg-white rounded-lg border border-gray-200 p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <i class="fa-solid fa-chart-line mr-2 text-success"></i>使用统计
                    </h2>
                    <div class="flex gap-2">
                        <button class="text-primary hover:text-primary/80 text-sm flex items-center">
                            <i class="fa-solid fa-file-lines mr-1"></i>
                            使用报告
                        </button>
                        <button class="text-primary hover:text-primary/80 text-sm flex items-center">
                            <i class="fa-solid fa-download mr-1"></i>
                            数据导出
                        </button>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">今日访问:</span>
                        <span class="font-medium text-success">15 次</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">本周访问:</span>
                        <span class="font-medium text-success">89 次</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">最常用:</span>
                        <span class="font-medium text-secondary">机械臂控制</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600">平均每日:</span>
                        <span class="font-medium text-success">12.7 次</span>
                    </div>
                </div>
                
                <div class="mt-6">
                    <h3 class="text-sm font-semibold text-gray-500 mb-2">访问趋势</h3>
                    <div class="h-32 bg-gray-50 rounded-md flex items-end justify-between p-2">
                        <div v-for="n in 7" :key="n" class="flex flex-col items-center">
                            <div class="w-8 bg-primary rounded-t" :style="`height: ${Math.floor(Math.random() * 80) + 10}px`"></div>
                            <span class="text-xs text-gray-500 mt-1">{{ ['周一','周二','周三','周四','周五','周六','周日'][n-1] }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Favorites -->
            <div id="add-favorites" class="bg-white rounded-lg border border-gray-200 p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center">
                        <i class="fa-solid fa-magnifying-glass mr-2 text-primary"></i>添加功能
                    </h2>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">搜索功能:</label>
                    <div class="relative">
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="输入功能名称..." v-model="searchQuery">
                        <button class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-primary">
                            <i class="fa-solid fa-search"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-medium text-gray-700 mb-2 flex items-center">
                        <i class="fa-solid fa-magnifying-glass mr-1 text-primary"></i>
                        可添加功能:
                    </h3>
                    <div class="space-y-3">
                        <div v-for="(item, index) in suggestedFunctions" :key="index" class="flex items-center justify-between p-3 border border-gray-200 rounded-md hover:border-primary/30 hover:bg-light transition-colors">
                            <div class="flex items-center">
                                <i :class="item.icon + ' text-lg text-primary'"></i>
                                <div class="ml-3">
                                    <h4 class="font-medium text-secondary">{{ item.name }}</h4>
                                    <span class="text-xs text-gray-500">{{ item.category }}</span>
                                </div>
                            </div>
                            <button class="px-3 py-1 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors text-sm" @click="addToFavorites(item)">
                                <i class="fa-solid fa-plus mr-1"></i>
                                添加
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mt-4 flex justify-end">
                    <button class="text-primary hover:text-primary/80 flex items-center">
                        <i class="fa-solid fa-list mr-1"></i>
                        查看全部功能
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        
        createApp({
            setup() {
                const favorites = ref([
                    { name: '机械臂控制', category: '控制类', icon: 'fa-solid fa-robot', usageCount: 67, lastUsed: '昨天14:30', status: 'normal' },
                    { name: '人脸识别', category: '交互类', icon: 'fa-solid fa-user', usageCount: 45, lastUsed: '今天10:15', status: 'normal' },
                    { name: '路径规划', category: '仿真类', icon: 'fa-solid fa-route', usageCount: 32, lastUsed: '昨天16:45', status: 'normal' },
                    { name: '系统监控', category: '监控类', icon: 'fa-solid fa-desktop', usageCount: 28, lastUsed: '今天09:20', status: 'warning' },
                    { name: '智能对话', category: '交互类', icon: 'fa-solid fa-comments', usageCount: 25, lastUsed: '今天14:10', status: 'normal' },
                    { name: '设备连接', category: '设备类', icon: 'fa-solid fa-plug', usageCount: 19, lastUsed: '昨天11:30', status: 'error' }
                ]);

                const suggestedFunctions = ref([
                    { name: '底盘控制', category: '控制类', icon: 'fa-solid fa-truck' },
                    { name: '视觉系统', category: '监控类', icon: 'fa-solid fa-camera' },
                    { name: '梯控系统', category: '设置类', icon: 'fa-solid fa-building' }
                ]);

                const activeCategory = ref('all');
                const searchQuery = ref('');

                const filteredFavorites = computed(() => {
                    let result = favorites.value;
                    if (activeCategory.value !== 'all') {
                        result = result.filter(item => item.category === activeCategory.value);
                    }
                    if (searchQuery.value) {
                        const query = searchQuery.value.toLowerCase();
                        result = result.filter(item => 
                            item.name.toLowerCase().includes(query) || 
                            item.category.toLowerCase().includes(query)
                        );
                    }
                    return result;
                });

                const filterByCategory = (category) => {
                    activeCategory.value = category;
                };

                const unfavorite = (item) => {
                    favorites.value = favorites.value.filter(f => f.name !== item.name);
                };

                const addToFavorites = (item) => {
                    // Add the new item to favorites
                    favorites.value.push({
                        ...item,
                        usageCount: 0,
                        lastUsed: '刚刚',
                        status: 'normal'
                    });
                    
                    // Remove from suggested
                    suggestedFunctions.value = suggestedFunctions.value.filter(f => f.name !== item.name);
                };

                onMounted(() => {
                    const el = document.getElementById('sortable-list');
                    if (el) {
                        new Sortable(el, {
                            animation: 150,
                            handle: '.fa-grip-vertical',
                            ghostClass: 'bg-gray-100'
                        });
                    }
                });

                return {
                    favorites,
                    suggestedFunctions,
                    activeCategory,
                    searchQuery,
                    filteredFavorites,
                    filterByCategory,
                    unfavorite,
                    addToFavorites
                };
            }
        }).mount('#app');
    </script>

</body></html>
